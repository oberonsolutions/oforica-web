# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Validate the allowlisted site on pull requests without publishing
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage allowlisted site files
        run: |
          mkdir -p _site/css _site/js
          cp index.html CNAME _site/
          cp css/style.css _site/css/
          cp js/copy.js js/site.js _site/js/
      - name: Confirm artifact allowlist
        run: |
          echo "Staged files:"
          find _site -type f | sort
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/CNAME
          test -f _site/js/copy.js
          test -f _site/js/site.js
          test ! -d _site/badangel2311
          test ! -d _site/img
          test ! -d _site/assets
          test ! -f assets/oforica.svg
          test ! -f assets/oforica-mark.svg
          if grep -R -E 'oforica\.svg|oforica-mark\.svg' _site; then
            echo "Retired lens-mark assets referenced in staged site" >&2
            exit 1
          fi
      - name: Confirm retired strings are gone
        run: |
          if grep -R -E 'firebaseConfig|gtag|G-DP5NR5KHR5|onlyfans|info@oforica.com|307-222-2070|under construction|Latin America' _site; then
            echo "Retired strings found in staged site" >&2
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage allowlisted site files
        run: |
          mkdir -p _site/css _site/js
          cp index.html CNAME _site/
          cp css/style.css _site/css/
          cp js/copy.js js/site.js _site/js/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
